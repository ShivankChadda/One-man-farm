<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>The One-Man Farm — explainer</title>
  <style>
    @font-face { font-family: 'Inter Tight'; font-weight: 500; src: url('../node_modules/@fontsource/inter-tight/files/inter-tight-latin-500-normal.woff2') format('woff2'); }
    @font-face { font-family: 'Inter Tight'; font-weight: 600; src: url('../node_modules/@fontsource/inter-tight/files/inter-tight-latin-600-normal.woff2') format('woff2'); }
    @font-face { font-family: 'Inter Tight'; font-weight: 700; src: url('../node_modules/@fontsource/inter-tight/files/inter-tight-latin-700-normal.woff2') format('woff2'); }
    @font-face { font-family: 'Inter Tight'; font-weight: 800; src: url('../node_modules/@fontsource/inter-tight/files/inter-tight-latin-800-normal.woff2') format('woff2'); }
    @font-face { font-family: 'Inter Tight'; font-weight: 900; src: url('../node_modules/@fontsource/inter-tight/files/inter-tight-latin-900-normal.woff2') format('woff2'); }
    @font-face { font-family: 'Instrument Serif'; font-style: italic; font-weight: 400; src: url('../node_modules/@fontsource/instrument-serif/files/instrument-serif-latin-400-italic.woff2') format('woff2'); }
    @font-face { font-family: 'JetBrains Mono'; font-weight: 500; src: url('../node_modules/@fontsource/jetbrains-mono/files/jetbrains-mono-latin-500-normal.woff2') format('woff2'); }
    html, body { margin: 0; background: #000; overflow: hidden; }
    #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #1b1a17; font-family: 'Inter Tight', sans-serif; color: #1f2b25; }
    .scene, .layer { position: absolute; inset: 0; }
    #scenes { z-index: 0; }
    #vignette { z-index: 2; }
    #captions { z-index: 3; }
    #black { z-index: 4; }
    .art { position: absolute; left: 0; top: 0; overflow: hidden; }
    .ui { position: absolute; inset: 0; pointer-events: none; }
    .label {
      position: absolute; display: flex; align-items: center; gap: 12px; transform-origin: 50% 100%;
      padding: 11px 20px 11px 16px; border-radius: 999px; background: rgba(255, 252, 244, 0.95);
      color: #1f2b25; font-weight: 600; font-size: 24px; letter-spacing: -0.01em;
      box-shadow: 0 6px 24px rgba(60, 40, 20, 0.2); white-space: nowrap;
    }
    .label i { width: 12px; height: 12px; border-radius: 50%; background: #9fd400; box-shadow: 0 0 0 4px rgba(159, 212, 0, 0.25); flex: none; }
    .label.warn i { background: #f0a020; box-shadow: 0 0 0 4px rgba(240, 160, 32, 0.25); }
    .label.pest i { background: #e8543e; box-shadow: 0 0 0 4px rgba(232, 84, 62, 0.25); }
    .label.big { font-size: 30px; padding: 14px 26px 14px 20px; }
    .label.dark { background: rgba(28, 36, 32, 0.9); color: #fffaf0; }
    .card { position: absolute; background: rgba(255, 252, 244, 0.96); border-radius: 28px; box-shadow: 0 18px 60px rgba(60, 40, 20, 0.22); }
    .title { font-weight: 900; letter-spacing: -0.045em; line-height: 0.95; color: #fffaf0; text-shadow: 0 4px 30px rgba(60, 30, 10, 0.35); }
    .serif { font-family: 'Instrument Serif', serif; font-style: italic; font-weight: 400; letter-spacing: -0.01em; }
    .mono { font-family: 'JetBrains Mono', monospace; text-transform: uppercase; letter-spacing: 0.2em; }
    #captions { position: absolute; left: 0; right: 0; bottom: 0; height: 240px; pointer-events: none;
      background: linear-gradient(to top, rgba(22, 14, 6, 0.42), rgba(22, 14, 6, 0)); }
    #captions div { position: absolute; left: 160px; right: 160px; bottom: 58px; text-align: center; font-weight: 600; font-size: 40px; line-height: 1.25;
      letter-spacing: -0.012em; color: #fffaf0; text-shadow: 0 2px 16px rgba(30, 18, 6, 0.6), 0 1px 3px rgba(30, 18, 6, 0.55); }
    #vignette { background: radial-gradient(ellipse at 50% 46%, transparent 58%, rgba(40, 22, 8, 0.32) 100%); }
    #black { background: #000; opacity: 0; }
  </style>
</head>
<body>
  <div id="stage">
    <svg width="0" height="0" style="position:absolute"><defs id="globalDefs"></defs></svg>
    <div id="scenes" class="layer"></div>
    <div id="vignette" class="layer"></div>
    <div id="captions"><div></div></div>
    <div id="black" class="layer"></div>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
